<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love Kakang</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
    background:
        radial-gradient(circle at top,#2d115a,#140022 55%,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Floating particles */

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#d79cff;
    border-radius:50%;
    opacity:.7;
    animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
opacity:0;
}
20%{opacity:.7;}
to{
transform:translateY(-120vh);
opacity:0;
}
}

/* Heart */

#heart{
    position:relative;
    width:min(95vw,900px);
    height:min(95vh,900px);
    animation:heartFloat 5s ease-in-out infinite;
}

@keyframes heartFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-12px);
}
}

.word{
    position:absolute;
    color:#bf7bff;
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;

    opacity:0;
    transform:scale(.3);

    animation:
    appear 2s forwards,
    glow 2.5s infinite alternate;
}

@keyframes appear{
to{
opacity:1;
transform:scale(1);
}
}

@keyframes glow{
from{
text-shadow:
0 0 5px #b46dff,
0 0 10px #b46dff,
0 0 18px #b46dff;
}
to{
text-shadow:
0 0 10px #e2b3ff,
0 0 20px #c46dff,
0 0 35px #c46dff,
0 0 50px #c46dff;
}
}

@media(max-width:700px){
.word{
font-size:9px;
}
}
</style>
</head>

<body>

<div id="heart"></div>

<script>

const heart=document.getElementById("heart");

const text="I LOVE KAKANG";

const scale=17;

let delay=0;

// Mathematical heart
for(let y=1.5;y>-1.6;y-=0.11){

for(let x=-1.6;x<1.6;x+=0.11){

let eq=Math.pow(x*x+y*y-1,3)-x*x*Math.pow(y,3);

if(eq<=0){

const span=document.createElement("span");

span.className="word";
span.innerText=text;

const px=(x*scale+27)*2;
const py=(15-y*scale)*2;

span.style.left=px+"px";
span.style.top=py+"px";

span.style.animationDelay=delay+"ms,"+(delay)+"ms";

heart.appendChild(span);

delay+=12;

}

}

}

// Background particles

for(let i=0;i<90;i++){

const p=document.createElement("div");
p.className="particle";

p.style.left=Math.random()*100+"vw";

const s=Math.random()*4+2;

p.style.width=s+"px";
p.style.height=s+"px";

p.style.animationDuration=(6+Math.random()*8)+"s";

p.style.animationDelay=Math.random()*10+"s";

document.body.appendChild(p);

}

</script>

</body>
</html>
