<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart</title>

<style>
html,body{
    margin:0;
    height:100%;
    background:#050008;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:monospace;
}

#heart{
    width:95vw;
    max-width:900px;
    color:#d946ef;
    text-align:center;
    font-size:clamp(8px,1.8vw,18px);
    font-weight:bold;
    line-height:1.25;
    text-shadow:
        0 0 5px #e879f9,
        0 0 15px #c026d3,
        0 0 30px #86198f;
}

.line{
    white-space:pre;
    height:auto;
}

</style>
</head>

<body>

<div id="heart"></div>


<script>

const box=document.getElementById("heart");


const love=[
"i love zaika",
"i love emee",
"i love kakang"
];



function heart(x,y){

    let a=Math.pow(x*x+y*y-1,3)
    -x*x*y*y*y;

    return a<=0;

}



let rows=[];


// create accurate heart shape

for(let y=1.5;y>-1.5;y-=0.12){

    let line="";

    for(let x=-1.5;x<1.5;x+=0.07){

        if(heart(x,y)){

            line+=love[
                Math.floor(
                Math.random()*love.length)
            ]+" ";

        }
        else{

            line+=" ";

        }

    }


    rows.push(line);

}




let i=0;


function print(){

    if(i>=rows.length){

        setTimeout(()=>{

            box.innerHTML="";
            i=0;
            print();

        },3000);

        return;
    }



    let div=document.createElement("div");

    div.className="line";

    box.appendChild(div);



    let text=rows[i];

    let c=0;


    let timer=setInterval(()=>{

        div.textContent+=text[c];

        c++;


        if(c>=text.length){

            clearInterval(timer);

            i++;

            setTimeout(print,80);

        }

    },3);



}


print();


</script>

</body>
</html>
