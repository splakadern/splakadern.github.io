<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Heart</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 90vw;
    height: 90vw;
    max-width: 600px;
    max-height: 600px;
}
</style>

</head>

<body>

<canvas id="heart"></canvas>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const text = [
    "i love zaika",
    "i love emee",
    "i love kakang",
    "i love zaika",
    "i love emee",
    "i love kakang"
].join("  •  ");


function resize(){
    const size = Math.min(
        window.innerWidth,
        window.innerHeight
    ) * 0.85;

    canvas.width = size;
    canvas.height = size;
}

resize();
window.addEventListener("resize", resize);


function heartPoint(t, scale){

    let x = 16 * Math.pow(Math.sin(t),3);

    let y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    return {
        x: canvas.width/2 + x * scale,
        y: canvas.height/2 - y * scale
    };
}


function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scale = canvas.width / 40;

    ctx.fillStyle = "#9b59ff";

    ctx.font = `${canvas.width/45}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    // draw words following smooth heart line
    let distance = 0;
    let chars = text.split("");

    for(let t = 0; t < Math.PI*2; t += 0.018){

        let p = heartPoint(t, scale);

        let letter = chars[
            Math.floor(distance) % chars.length
        ];

        ctx.fillText(
            letter,
            p.x,
            p.y
        );

        distance += 0.65;
    }


    requestAnimationFrame(draw);
}


draw();

</script>

</body>
</html>
